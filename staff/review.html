<script>
// Both documents are produced by the local build, never from query-string markup.
(async () => {
  const pages = JSON.parse(document.getElementById('canon-review-pages').textContent);
  const query = new URLSearchParams(location.search);
  const song = query.get('song') || 'reference';
  const key = 'density-'+song;
  if (!Object.hasOwn(pages, key)) throw new Error('未提供所選歌曲報告：'+song);
  const doc = new DOMParser().parseFromString(pages[key], 'text/html');
  const scripts = Array.from(doc.querySelectorAll('script')).filter(s =>
    !s.type || ['module','text/javascript','application/javascript'].includes(s.type));
  for (const s of scripts) s.remove(); // Activate exactly the chosen page, in source order.
  document.documentElement.lang = doc.documentElement.lang || 'zh-HK';
  document.title = doc.title;
  for (const n of doc.head.querySelectorAll('style,link')) document.head.append(document.importNode(n,true));
  document.body.replaceChildren(...Array.from(doc.body.childNodes,n=>document.importNode(n,true)));
  for (const s of scripts) {
    const node = document.createElement('script');
    for (const a of s.attributes) node.setAttribute(a.name, a.value);
    if (s.hasAttribute('src')) {
      await new Promise((resolve,reject) => {
        node.onload=resolve; node.onerror=()=>reject(new Error(s.getAttribute('src')));
        document.body.append(node);
      });
    } else { node.textContent=s.textContent; document.body.append(node); }
  }
})().catch(e => {
  const msg=document.createElement('p');msg.setAttribute('role','alert');
  msg.textContent='未能載入本機報告：'+e.message;document.body.append(msg);
});
</script></body></html>
